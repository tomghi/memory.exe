<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contagem Regressiva</title>

<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    height:100vh;
    font-family:Arial,sans-serif;
}

#contador{
    font-size:120px;
    margin-bottom:30px;
}

#botao{
    display:none;
    padding:15px 40px;
    font-size:22px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#00c853;
    color:white;
    transition:.3s;
}

#botao:hover{
    background:#00e676;
}
</style>

</head>
<body>

<h1 id="contador">10</h1>

<audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<button id="botao" onclick="window.location.href='pagina2.html'">
    Continuar
</button>

<script>
let numero = 10;

const contador = document.getElementById("contador");
const botao = document.getElementById("botao");

const intervalo = setInterval(() => {

    contador.innerHTML = numero;

    if(numero == 0){
        clearInterval(intervalo);
        contador.innerHTML = "Fim!";
        botao.style.display = "block";
    }

    numero--;

},1000);
</script>

</body>
</html>
